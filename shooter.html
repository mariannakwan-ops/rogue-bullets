<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROGUE SQUADRON</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { cursor: none; display: block; }

<body>
<canvas id="c"></canvas>
<script>
// ─── CANVAS SETUP ────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900, H = 650;
canvas.width = W; canvas.height = H;

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const PLAYER_SPEED   = 190;
const PLAYER_RADIUS  = 14;
const BULLET_SPEED   = 430;
const ENEMY_BULLET_SPEED = 210;
const SHOOT_RATE     = 0.13;
const INVINCIBLE_TIME = 0.6;
const MUZZLE_TIME    = 0.09;
const HIT_FLASH_TIME = 0.14;
const ENEMY_DEATH_DURATION = 0.45;
const AGGRO_RANGE    = 260;
const MARGIN         = 30;
const WALL_PAD       = 48;

// ─── WEAPONS ─────────────────────────────────────────────────────────────────
const WEAPONS = {
  blaster:    { name:'BLASTER',      desc:'Standard issue',    fireRate:0.13, damage:1, count:1, spread:0,    pierce:false, color:'#00e5ff' },
  dual:       { name:'DUAL BLASTER', desc:'Twin barrels',      fireRate:0.16, damage:1, count:2, spread:0.14, pierce:false, color:'#00ff88' },
  rapidFire:  { name:'RAPID FIRE',   desc:'High rate of fire', fireRate:0.06, damage:1, count:1, spread:0.04, pierce:false, color:'#ffaa00' },
  shotgun:    { name:'SHOTGUN',      desc:'Wide spread',       fireRate:0.45, damage:1, count:5, spread:0.28, pierce:false, color:'#ff6600' },
  ionCannon:  { name:'ION CANNON',   desc:'Pierces all targets',fireRate:0.28, damage:3, count:1, spread:0,   pierce:true,  color:'#aa00ff' },
  lightsaber: { name:'LIGHTSABER',   desc:'Melee – close range',fireRate:0.05, damage:2, count:1, spread:0,   melee:true,   color:'#00ff00' },

// ─── ENEMY STATS ─────────────────────────────────────────────────────────────
const ENEMY_STATS = {
  stormtrooper: { speed:72,  hp:2, radius:12, score:100, color:'#cccccc', eyeColor:'#ff2200' },
  probe_droid:  { speed:135, hp:1, radius:9,  score:150, color:'#2a2a3a', eyeColor:'#00ff44' },
  at_st:        { speed:42,  hp:6, radius:20, score:250, color:'#5a6040', eyeColor:'#ffaa00' },
  tie_fighter:  { speed:52,  hp:3, radius:14, score:200, color:'#111122', eyeColor:'#00e5ff' },
  sith:         { speed:90,  hp:4, radius:13, score:300, color:'#440000', eyeColor:'#ff0000' },
};

// ─── BOSS STATS ───────────────────────────────────────────────────────────────
const BOSS_STATS = {
  darth_vader: { name:'DARTH VADER',  hp:40, radius:28, speed:65,  score:1000, color:'#0a0a0a', eyeColor:'#ff0000' },
  boba_fett:   { name:'BOBA FETT',    hp:30, radius:22, speed:85,  score:800,  color:'#3a6040', eyeColor:'#ffdd00' },
  emperor:     { name:'THE EMPEROR',  hp:50, radius:24, speed:38,  score:1200, color:'#180a2e', eyeColor:'#aa00ff' },
  at_at:       { name:'AT-AT WALKER', hp:80, radius:36, speed:26,  score:2000, color:'#5a5a48', eyeColor:'#ffaa00' },
};
const BOSS_ORDER = ['darth_vader','boba_fett','emperor','at_at'];

const LEVELS = [
  { count:5,  types:['stormtrooper'],                                     spawnDelay:2.0, boss:false },
  { count:8,  types:['stormtrooper','probe_droid'],                       spawnDelay:1.7, boss:true  },
  { count:10, types:['stormtrooper','probe_droid','at_st'],               spawnDelay:1.5, boss:true  },
  { count:12, types:['stormtrooper','tie_fighter','at_st'],               spawnDelay:1.3, boss:true  },

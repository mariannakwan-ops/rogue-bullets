];

// ─── INPUT ────────────────────────────────────────────────────────────────────
const input = { keys: {}, mx: W/2, my: H/2, down: false, clicked: false };
window.addEventListener('keydown', e => {
  input.keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') music.cycle();
});
['click','keydown'].forEach(ev =>
  window.addEventListener(ev, () => music.start(), { once: true })
);
window.addEventListener('keyup',   e => { input.keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  input.mx = (e.clientX - r.left) * (W / r.width);
  input.my = (e.clientY - r.top)  * (H / r.height);
});
canvas.addEventListener('mousedown', e => {
  if (e.button!==0) return;
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (W / r.width);
  const cy = (e.clientY - r.top)  * (H / r.height);
  // Check weapon card clicks (weapon select screen)
  if (gameState.current==='weaponSelect' && gameState._weaponCards) {
    for (const [key, r] of Object.entries(gameState._weaponCards)) {
      if (cx>=r.x && cx<=r.x+r.w && cy>=r.y && cy<=r.y+r.h) {
        gameState._weaponCardHit = key;
        input.clicked=true;
        return;
      }
    }
  }
  // Shop clicks
  if (gameState.current==='shop' && gameState._shopHitZones) {
    for (const z of gameState._shopHitZones) {
      if (cx>=z.x && cx<=z.x+z.w && cy>=z.y && cy<=z.y+z.h) {
        z.action();
        return;
      }
    }
  }
  // Lobby weapon pick clicks
  if (gameState.current==='lobby' && gameState._lobbyCards) {
    for (const [key, r] of Object.entries(gameState._lobbyCards)) {
      if (cx>=r.x && cx<=r.x+r.w && cy>=r.y && cy<=r.y+r.h) {
        gameState.weapon=key; return;
      }
    }
    if (gameState._lobbyLaunch) {
      const b=gameState._lobbyLaunch;
      if (cx>=b.x && cx<=b.x+b.w && cy>=b.y && cy<=b.y+b.h) {
        startGame(); input.clicked=false; return;
      }
    }
  }
  // Check music button clicks
  const btns = gameState._musicBtns;
  if (btns) {
    for (const [m, b] of Object.entries(btns)) {
      if (cx>=b.x && cx<=b.x+b.w && cy>=b.y && cy<=b.y+b.h) {
        music.setMode(m);
        return;
      }
    }
  }
  input.down=true; input.clicked=true;
});
canvas.addEventListener('mouseup',   e => { if (e.button===0) input.down=false; });
window.addEventListener('keypress',  e => { input.clicked = true; });


// ─── AUDIO ───────────────────────────────────────────────────────────────────
const sfx = (() => {
  let ac = null;
  function ctx() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function osc(type, freq, endFreq, duration, vol, startTime) {
    const c = ctx(), t = startTime ?? c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + duration);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + duration + 0.01);
  }

  function noise(duration, vol, filterFreq, filterType, startTime) {
    const c = ctx(), t = startTime ?? c.currentTime;
    const len = Math.ceil(c.sampleRate * duration);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), g = c.createGain();
    const filt = c.createBiquadFilter();
    filt.type = filterType || 'bandpass';
    filt.frequency.value = filterFreq || 800;
    filt.Q.value = 1.2;
    src.buffer = buf;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    src.connect(filt); filt.connect(g); g.connect(c.destination);
    src.start(t); src.stop(t + duration + 0.01);
  }

  return {
    shoot() {
      // Sharp laser pew — square wave sweep down
      osc('square', 1100, 180, 0.09, 0.12);
      noise(0.04, 0.06, 2000, 'highpass');
    },
    enemyShoot() {
      // Lower, grittier pew
      osc('sawtooth', 600, 120, 0.1, 0.08);
      noise(0.05, 0.04, 900, 'bandpass');
    },
    enemyHit() {
      // Short crack/thwack
      noise(0.06, 0.25, 1200, 'bandpass');
      osc('square', 300, 80, 0.06, 0.06);
    },
    explosion(large) {
      // Rumble burst — layered noise
      noise(large ? 0.55 : 0.35, large ? 0.6 : 0.4, 120, 'lowpass');
      noise(large ? 0.4  : 0.25, large ? 0.3 : 0.2, 350, 'bandpass');
      osc('sawtooth', large ? 120 : 180, 30, large ? 0.5 : 0.3, large ? 0.2 : 0.12);
    },
    playerHit() {
      // Heavy low thud
      noise(0.12, 0.35, 200, 'lowpass');
      osc('sine', 220, 60, 0.15, 0.18);
    },
    playerDeath() {
      // Big explosion + descending wail
      noise(0.8, 0.7, 100, 'lowpass');
      noise(0.5, 0.35, 400, 'bandpass');
      osc('sawtooth', 440, 55, 0.9, 0.25);
      osc('square',   220, 40, 0.7, 0.15);
    },
    levelComplete() {
      // Ascending arpeggio: C E G C (major chord sweep)
      const c = ctx(), now = c.currentTime;
      [[523,0],[659,0.12],[784,0.24],[1047,0.36]].forEach(([f,delay]) => {
        osc('square', f, f*0.98, 0.18, 0.12, now+delay);
      });
      // Shimmery tail
      osc('sine', 1047, 880, 0.4, 0.08, now+0.5);
    },
    gameOver() {
      // Descending sad tones
      const c = ctx(), now = c.currentTime;
      [[392,0],[349,0.2],[330,0.4],[262,0.65]].forEach(([f,delay]) => {
        osc('square', f, f*0.95, 0.28, 0.1, now+delay);
        osc('sine',   f, f*0.95, 0.35, 0.06, now+delay);
      });
    },
    enemySpawn() {
      // Subtle whoosh
      noise(0.2, 0.08, 600, 'bandpass');
      osc('sine', 80, 200, 0.15, 0.07);
    },
  };
})();

// ─── MUSIC (lofi / rock / kpop) ──────────────────────────────────────────────
const music = (() => {
  let ac = null, master = null, vinylGain = null;
  let mode = 'off';
  const MODES = ['off', 'lofi', 'rock', 'kpop'];
  let timer = null, nextTime = 0, beat = 0;
  let lofiCI = 0, rockCI = 0, kpopCI = 0;

  function init() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const len = Math.ceil(ac.sampleRate * 3), buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++)
      d[i] = Math.random() < 0.004 ? (Math.random()*2-1)*0.22 : (Math.random()*2-1)*0.004;
    const vs = ac.createBufferSource(); vs.buffer = buf; vs.loop = true;
    vinylGain = ac.createGain(); vinylGain.gain.value = 0;
    vs.connect(vinylGain); vinylGain.connect(master); vs.start();
  }
  function ensure() { if (!ac) init(); if (ac.state==='suspended') ac.resume(); }
  function lpf(hz,q) { const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=hz; if(q)f.Q.value=q; return f; }
  function hpf(hz)   { const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hz; return f; }
  function disto(amt){ const ws=ac.createWaveShaper(),n=512,c=new Float32Array(n);
    for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(Math.PI+amt)*x/(Math.PI+amt*Math.abs(x));}
    ws.curve=c; ws.oversample='4x'; return ws; }
  function nb(dur,vol,ft,fhz,t){ // noise burst
    const len=Math.ceil(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type=ft; f.frequency.value=fhz;
    const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.01); }
  function hat(t,open,vol){nb(open?0.12:0.04,vol||0.05,'highpass',8000,t);}

  // ── LOFI ──────────────────────────────────────────────────────────────────
  const LB=60/78, LCL=LB*8;
  const LCH=[{notes:[130.81,164.81,196,246.94],bass:65.41},{notes:[110,130.81,164.81,196],bass:55},
             {notes:[87.31,110,130.81,164.81],bass:43.65},{notes:[98,123.47,146.83,174.61],bass:49}];
  function lofiTick(t,b) {
    const sw=(b%2===1)?LB*0.035:0, e8=b%8;
    if (b%16===0) {
      LCH[lofiCI].notes.forEach(hz=>[-4,4].forEach(det=>{
        const o=ac.createOscillator(),g=ac.createGain(),f=lpf(680,0.7);
        o.type='triangle'; o.frequency.value=hz; o.detune.value=det;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.052,t+1);
        g.gain.setValueAtTime(0.052,t+LCL-0.6); g.gain.linearRampToValueAtTime(0,t+LCL);
        o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+LCL+0.1);}));
      const bassHz=LCH[lofiCI].bass;
      const bo=ac.createOscillator(),bg=ac.createGain(),bf=lpf(200);
      bo.type='sine'; bo.frequency.value=bassHz;
      bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(0.26,t+0.06);
      bg.gain.exponentialRampToValueAtTime(0.001,t+LB*4-0.1);
      bo.connect(bf); bf.connect(bg); bg.connect(master); bo.start(t); bo.stop(t+LB*4);
      lofiCI=(lofiCI+1)%LCH.length;
    }
    if (b%16===8) {
      const ci=(lofiCI-1+LCH.length)%LCH.length;
      const bo=ac.createOscillator(),bg=ac.createGain(),bf=lpf(200);
      bo.type='sine'; bo.frequency.value=LCH[ci].bass;
      bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(0.26,t+0.06);
      bg.gain.exponentialRampToValueAtTime(0.001,t+LB*4-0.1);
      bo.connect(bf); bf.connect(bg); bg.connect(master); bo.start(t); bo.stop(t+LB*4);
    }
    const ht=t+sw,hl=Math.ceil(ac.sampleRate*0.06),hb=ac.createBuffer(1,hl,ac.sampleRate);
    const hd=hb.getChannelData(0); for(let i=0;i<hl;i++) hd[i]=Math.random()*2-1;
    const hs=ac.createBufferSource(); hs.buffer=hb;
    const hf=hpf(7000),hg=ac.createGain();
    const acc=e8===0||e8===4;
    hg.gain.setValueAtTime(acc?0.07:0.032,ht); hg.gain.exponentialRampToValueAtTime(0.001,ht+0.05);
    hs.connect(hf); hf.connect(hg); hg.connect(master); hs.start(ht); hs.stop(ht+0.06);
  }

  // ── HARD ROCK ─────────────────────────────────────────────────────────────
  const RB=60/140, RBAR=RB*4;
  const RCH=[{root:82.41,fifth:123.47,bass:41.2},{root:110,fifth:164.81,bass:55},
             {root:98,fifth:146.83,bass:49},{root:110,fifth:164.81,bass:55}];
  function rockTick(t,b) {
    const e8=b%8;
    if (b%16===0) {
      [RCH[rockCI].root,RCH[rockCI].fifth].forEach(hz=>[-8,0,8].forEach(det=>{
        const o=ac.createOscillator(),g=ac.createGain(),ds=disto(280),f=lpf(1400,0.5);
        o.type='sawtooth'; o.frequency.value=hz; o.detune.value=det;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.04,t+0.02);
        g.gain.setValueAtTime(0.04,t+RBAR*2-0.1); g.gain.linearRampToValueAtTime(0,t+RBAR*2);
        o.connect(ds); ds.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+RBAR*2+0.1);}));
      rockCI=(rockCI+1)%RCH.length;
    }
    if (e8===0||e8===4||b%16===6) { // kick
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.08);
      g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.13); nb(0.015,0.3,'highpass',3000,t);
    }
    if (e8===2||e8===6) { // snare
      nb(0.12,0.45,'bandpass',1200,t);
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='triangle'; o.frequency.value=200;
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.11);
    }
    hat(t,e8===7,e8===7?0.05:0.04);
    if (e8===0||e8===4) { // bass
      const ci=(rockCI-1+RCH.length)%RCH.length;
      const o=ac.createOscillator(),g=ac.createGain(),f=lpf(300);
      o.type='sawtooth'; o.frequency.value=RCH[ci].bass;
      g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+RB*2-0.05);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+RB*2);
    }
  }

  // ── KPOP ──────────────────────────────────────────────────────────────────
  const KB=60/128, KBAR=KB*4;
  const KCH=[{notes:[261.63,329.63,392,523.25],bass:130.81},{notes:[196,246.94,293.66,392],bass:98},
             {notes:[220,261.63,329.63,440],bass:110},{notes:[174.61,220,261.63,349.23],bass:87.31}];
  const KARP=[0,2,1,3,0,2,3,1];
  function kpopTick(t,b) {
    const e8=b%8;
    if (b%8===0) {
      KCH[kpopCI].notes.forEach(hz=>{
        const o=ac.createOscillator(),g=ac.createGain(),f=lpf(2200,0.5);
        o.type='square'; o.frequency.value=hz; o.detune.value=2;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.038,t+0.01);
        g.gain.setValueAtTime(0.038,t+KBAR-0.08); g.gain.linearRampToValueAtTime(0,t+KBAR);
        o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+KBAR+0.05);});
      const bo=ac.createOscillator(),bg=ac.createGain(),bf=lpf(400);
      bo.type='sine'; bo.frequency.value=KCH[kpopCI].bass;
      bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(0.3,t+0.03);
      bg.gain.exponentialRampToValueAtTime(0.001,t+KBAR-0.05);
      bo.connect(bf); bf.connect(bg); bg.connect(master); bo.start(t); bo.stop(t+KBAR);
      kpopCI=(kpopCI+1)%KCH.length;
    }
    if (e8%2===0) { // four-on-floor kick
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(45,t+0.07);
      g.gain.setValueAtTime(0.75,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+0.11);
    }
    if (e8===2||e8===6) { nb(0.08,0.35,'bandpass',2000,t); nb(0.04,0.15,'highpass',6000,t); } // clap
    const ci=(kpopCI-1+KCH.length)%KCH.length;
    const arpHz=KCH[ci].notes[KARP[b%8]]*2;
    const ao=ac.createOscillator(),ag=ac.createGain();
    ao.type='triangle'; ao.frequency.value=arpHz;
    ag.gain.setValueAtTime(0.08,t); ag.gain.exponentialRampToValueAtTime(0.001,t+KB*0.45);
    ao.connect(ag); ag.connect(master); ao.start(t); ao.stop(t+KB*0.5);
    nb(0.03,0.04,'highpass',9000,t); // 16th hats
  }

  // ── SCHEDULER ─────────────────────────────────────────────────────────────
  function beatDur() { return (mode==='lofi'?LB : mode==='rock'?RB : KB)/2; }
  function runSched() {
    if (!ac||mode==='off') return;
    const now=ac.currentTime;
    while (nextTime<now+0.1) {
      if (mode==='lofi') lofiTick(nextTime,beat);
      else if (mode==='rock') rockTick(nextTime,beat);
      else if (mode==='kpop') kpopTick(nextTime,beat);
      nextTime+=beatDur(); beat++;
    }
  }

  function setMode(m) {
    ensure(); mode=m; clearInterval(timer); timer=null; beat=0; lofiCI=0; rockCI=0; kpopCI=0;
    if (m!=='off') {
      master.gain.setTargetAtTime(0.32,ac.currentTime,0.1);
      vinylGain.gain.setTargetAtTime(m==='lofi'?0.2:0,ac.currentTime,0.5);
      nextTime=ac.currentTime+0.1; runSched(); timer=setInterval(runSched,25);
    } else {
      master.gain.setTargetAtTime(0,ac.currentTime,0.3);
      vinylGain.gain.setTargetAtTime(0,ac.currentTime,0.5);
    }
  }

  function cycle() { ensure(); setMode(MODES[(MODES.indexOf(mode)+1)%MODES.length]); }
  function start() { ensure(); }
  return { start, cycle, setMode: m => { ensure(); setMode(m); }, getMode:()=>mode };
})();

// ─── UTILITIES ───────────────────────────────────────────────────────────────
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(rand(min, max+1)); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function spawnEdgePos() {
  const side = randInt(0, 3);
  switch(side) {
    case 0: return { x: rand(MARGIN, W-MARGIN), y: -MARGIN };
    case 1: return { x: W+MARGIN, y: rand(MARGIN, H-MARGIN) };
    case 2: return { x: rand(MARGIN, W-MARGIN), y: H+MARGIN };
    default:return { x: -MARGIN, y: rand(MARGIN, H-MARGIN) };
  }
}

// ─── PARTICLE ────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, type, life, size, color) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.type=type; this.life=life; this.maxLife=life;
    this.size = size || 3;
    this.color = color || '#ff4444';
  }
  update(dt) {
    const drag = this.type==='smoke' ? 0.85 : this.type==='blood' ? 0.92 : 0.96;
    this.vx *= Math.pow(drag, dt*60);
    this.vy *= Math.pow(drag, dt*60);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  draw(ctx) {
    const t = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = Math.max(0, t);
    if (this.type==='smoke') {
      const s = this.size * (1 + (1-t)*1.5);
      ctx.fillStyle = `rgb(80,80,80)`;
      ctx.beginPath(); ctx.arc(this.x, this.y, s, 0, Math.PI*2); ctx.fill();
    } else if (this.type==='spark') {
      ctx.fillStyle = t > 0.5 ? '#fff' : '#ffdd00';
      ctx.fillRect(this.x - 1.5, this.y - 1.5, 3, 3);
    } else if (this.type==='explosion') {
      const c = t > 0.5 ? '#ff8800' : '#ff2200';
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * t, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (0.5 + t*0.5), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function spawnDeathParticles(x, y, type) {
  const isLarge = type==='at_st'||type==='at_at'||type==='darth_vader'||type==='emperor';
  const count = isLarge ? 22 : 10;
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI*2);
    const s = rand(30, isLarge ? 160 : 120);
    particles.push(new Particle(x, y, Math.cos(a)*s, Math.sin(a)*s, 'blood', rand(0.3,0.6), rand(2,4), '#8b0000'));
  }
  for (let i = 0; i < 6; i++) {
    const a = rand(0, Math.PI*2); const s = rand(20,80);
    particles.push(new Particle(x, y, Math.cos(a)*s, Math.sin(a)*s, 'spark', rand(0.2,0.4)));
  }
  for (let i = 0; i < 4; i++) {
    const a = rand(0, Math.PI*2); const s = rand(10,40);
    particles.push(new Particle(x, y, Math.cos(a)*s, Math.sin(a)*s, 'smoke', rand(0.5,1.0), rand(8,14)));
  }
  particles.push(new Particle(x, y, 0, 0, 'explosion', 0.4, isLarge ? 22 : 14));
}

function spawnHitParticles(x, y) {
  for (let i = 0; i < 4; i++) {
    const a = rand(0, Math.PI*2); const s = rand(40,100);
    particles.push(new Particle(x, y, Math.cos(a)*s, Math.sin(a)*s, 'spark', rand(0.1,0.25)));
  }
}

// ─── BULLET ──────────────────────────────────────────────────────────────────
class Bullet {
  constructor(x, y, vx, vy, fromPlayer) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.fromPlayer=fromPlayer;
    this.alive=true;
    this.trail=[];
    this.damage = fromPlayer ? 1 : 1;
    this.radius = fromPlayer ? 4 : 3;
  }
  update(dt) {
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length > 7) this.trail.shift();
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -50||this.x > W+50||this.y < -50||this.y > H+50) this.alive=false;
  }
  draw(ctx) {
    const ang = Math.atan2(this.vy, this.vx);
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      const a = (i / this.trail.length) * 0.4;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = this.fromPlayer ? '#00bcd4' : '#ff6b35';
      ctx.beginPath();
      ctx.arc(this.trail[i].x, this.trail[i].y, this.radius * 0.5, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(ang);
    if (this.fromPlayer) {
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(-7, -2.5, 12, 5);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, -1.5, 5, 3);
    } else {
      ctx.fillStyle = '#ff6b35';
      ctx.fillRect(-5, -2, 9, 4);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(-2, -1, 4, 2);
    }
    ctx.restore();
  }
}

// ─── SCORE POPUP ─────────────────────────────────────────────────────────────
class ScorePopup {
  constructor(x, y, value) { this.x=x; this.y=y; this.value=value; this.life=1.0; }
  update(dt) { this.life -= dt * 1.8; this.y -= 28 * dt; }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+' + this.value, this.x, this.y);
    ctx.restore();
  }
}

// ─── PICKUP ITEMS ─────────────────────────────────────────────────────────────
const PICKUP_TYPES = {
  health: { color:'#2ecc71', glow:'#00ff88', label:'+25 HP',   radius:10 },
  shield: { color:'#00bcd4', glow:'#00e5ff', label:'SHIELD',   radius:10 },
  speed:  { color:'#f1c40f', glow:'#ffee00', label:'SPEED UP', radius:10 },
};

class PickupItem {
  constructor(x, y, type) {
    this.x=x; this.y=y; this.type=type;
    this.radius=10; this.life=12.0; // 12 seconds before it disappears
    this.pulse=Math.random()*Math.PI*2; // random start phase
    this.alive=true;
  }
  update(dt) {
    this.pulse+=dt*3;
    this.life-=dt;
    if (this.life<=0) this.alive=false;
  }
  draw(ctx) {
    if (!this.alive) return;
    const info = PICKUP_TYPES[this.type];
    const glow = 0.5+0.5*Math.sin(this.pulse);
    const r = this.radius + glow*3;
    ctx.save();
    // Glow ring
    ctx.globalAlpha=0.35+0.25*glow;
    ctx.fillStyle=info.glow;
    ctx.beginPath(); ctx.arc(this.x,this.y,r+5,0,Math.PI*2); ctx.fill();
    // Core orb
    ctx.globalAlpha=this.life<2 ? this.life/2 : 1;
    ctx.fillStyle=info.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,r,0,Math.PI*2); ctx.fill();
    // Icon
    ctx.fillStyle='#fff'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
    const icon = this.type==='health' ? '♥' : this.type==='shield' ? '◈' : '⚡';
    ctx.fillText(icon, this.x, this.y+4);
    // Fade warning when about to expire
    if (this.life<3) {
      ctx.globalAlpha=0.6*Math.abs(Math.sin(this.pulse*2));
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(this.x,this.y,r+3,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
}

function spawnPickup(x, y, type) {
  // Small random scatter so items don't stack
  const a=Math.random()*Math.PI*2, d=rand(0,18);
  pickups.push(new PickupItem(x+Math.cos(a)*d, y+Math.sin(a)*d, type));
}

// ─── PLAYER ──────────────────────────────────────────────────────────────────
class Player {
  constructor() {
    this.x = W/2; this.y = H/2;
    this.vx = 0; this.vy = 0;
    this.angle = 0;
    this.health = 100; this.maxHealth = 100;
    this.speed = PLAYER_SPEED;
    this.radius = PLAYER_RADIUS;
    this.shootCooldown = 0;
    this.invincibleTimer = 0;
    this.muzzleFlashTimer = 0;
    this.hitFlashTimer = 0;
    this.walkCycle = 0;
    this.alive = true;
    this.deathTimer = 0;
  }
  update(dt) {
    if (!this.alive) { this.deathTimer += dt; return; }
    const dx = (input.keys['ArrowRight']||input.keys['KeyD']?1:0) - (input.keys['ArrowLeft']||input.keys['KeyA']?1:0);
    const dy = (input.keys['ArrowDown'] ||input.keys['KeyS']?1:0) - (input.keys['ArrowUp']  ||input.keys['KeyW']?1:0);
    const len = Math.hypot(dx,dy) || 1;
    const moving = dx!==0||dy!==0;
    const spd = this.speed * (gameState.speedBoostTimer>0 ? 1.6 : 1);
    this.vx = moving ? (dx/len)*spd : 0;
    this.vy = moving ? (dy/len)*spd : 0;
    if (moving) this.walkCycle += dt * 8;
    this.x = clamp(this.x + this.vx*dt, PLAYER_RADIUS, W-PLAYER_RADIUS);
    this.y = clamp(this.y + this.vy*dt, PLAYER_RADIUS, H-PLAYER_RADIUS);
    this.angle = Math.atan2(input.my - this.y, input.mx - this.x);
    this.shootCooldown  = Math.max(0, this.shootCooldown  - dt);
    this.invincibleTimer= Math.max(0, this.invincibleTimer- dt);
    this.muzzleFlashTimer=Math.max(0, this.muzzleFlashTimer-dt);
    this.hitFlashTimer  = Math.max(0, this.hitFlashTimer  - dt);

    if (input.down && this.shootCooldown <= 0) {
      this.shoot();
    }
  }
  shoot() {
    const w = WEAPONS[gameState.weapon] || WEAPONS.blaster;
    this.shootCooldown = w.fireRate;
    this.muzzleFlashTimer = MUZZLE_TIME;
    sfx.shoot();
    const tipX = this.x + Math.cos(this.angle)*22;
    const tipY = this.y + Math.sin(this.angle)*22;

    if (w.melee) {
      // Lightsaber: instant arc damage
      for (const e of enemies) {
        if (!e.alive) continue;
        if (dist(this, e) < 55) e.takeDamage(w.damage);
      }
      // Arc particles
      for (let i=0;i<12;i++){
        const a=this.angle+rand(-0.7,0.7); const s=rand(60,140);
        particles.push(new Particle(this.x+Math.cos(a)*20,this.y+Math.sin(a)*20,Math.cos(a)*s,Math.sin(a)*s,'spark',0.18,3,'#00ff44'));
      }
      return;
    }

    for (let i=0;i<w.count;i++){
      const offset = w.count>1 ? w.spread*(i-(w.count-1)/2) : 0;
      const a = this.angle + offset + (w.spread > 0 && w.count===1 ? rand(-w.spread,w.spread) : 0);
      const b = new Bullet(tipX,tipY,Math.cos(a)*BULLET_SPEED,Math.sin(a)*BULLET_SPEED,true);
      b.damage = w.damage;
      b.pierce = w.pierce || false;
      b.weaponColor = w.color;
      bullets.push(b);
    }
    for (let i=0;i<3;i++){
      const a=this.angle+rand(-0.3,0.3); const s=rand(40,90);
      particles.push(new Particle(tipX,tipY,Math.cos(a)*s,Math.sin(a)*s,'spark',0.12));
    }
  }
  takeDamage(dmg) {
    if (this.invincibleTimer > 0) return;
    this.health -= dmg;
    this.invincibleTimer = INVINCIBLE_TIME;
    this.hitFlashTimer   = HIT_FLASH_TIME;
    if (this.health <= 0) { this.health=0; this.alive=false; spawnDeathParticles(this.x,this.y,'player'); sfx.playerDeath(); }
    else { sfx.playerHit(); }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (!this.alive) {
      const t = Math.min(this.deathTimer / 0.5, 1);
      ctx.globalAlpha = Math.max(0, 1-t);
      ctx.scale(1 + t*2, 1 + t*2);
    }

    ctx.rotate(this.angle);
    const flash = this.hitFlashTimer > 0;
    const invBlink = this.invincibleTimer > 0 && Math.floor(this.invincibleTimer*12)%2===0;
    if (invBlink) { ctx.restore(); return; }

    // Shadow
    ctx.save(); ctx.rotate(-this.angle);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(2,3,13,8,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // Legs (P2 = teal/orange palette)
    const leg = Math.sin(this.walkCycle)*5;
    const legCol  = this.isP2 ? '#3a2a00' : '#1a3a15';
    const bodyCol = this.isP2 ? '#c07000' : '#2d6a23';
    const bodyCol2= this.isP2 ? '#8a5000' : '#245218';
    ctx.fillStyle = flash ? '#fff' : legCol;
    ctx.fillRect(-9, -9+leg, 8, 5);
    ctx.fillRect(-9,  4-leg, 8, 5);

    // Body
    ctx.fillStyle = flash ? '#fff' : bodyCol;
    ctx.fillRect(-10,-10,20,20);
    // Chest detail
    if (!flash) {
      ctx.fillStyle=bodyCol2;
      ctx.fillRect(-7,-7,14,14);
      ctx.fillStyle=bodyCol;
      ctx.fillRect(-5,-5,10,10);
    }

    // Head
    ctx.fillStyle = flash ? '#fff' : '#c8a27a';
    ctx.beginPath(); ctx.arc(4, 0, 7, 0, Math.PI*2); ctx.fill();
    if (!flash) {
      ctx.fillStyle='#a07850';
      ctx.fillRect(5,-3,4,6); // helmet visor
    }

    // Gun barrel
    ctx.fillStyle = flash ? '#fff' : '#222';
    ctx.fillRect(2, -2.5, 16, 5);
    ctx.fillStyle = flash ? '#fff' : '#444';
    ctx.fillRect(14, -1.5, 4, 3);

    // Muzzle flash
    if (this.muzzleFlashTimer > 0) {
      const a = this.muzzleFlashTimer / MUZZLE_TIME;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle='#ffe000';
      ctx.beginPath(); ctx.arc(22, 0, 7+a*4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(24, 0, 3, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }
}

// ─── ENEMY ───────────────────────────────────────────────────────────────────
class Enemy {
  constructor(x, y, type) {
    this.x=x; this.y=y; this.type=type;
    const s = type==='boss' ? {speed:60,hp:40,radius:28,score:1000,color:'#111',eyeColor:'#f00'} : ENEMY_STATS[type];
    this.speed=s.speed; this.health=s.hp; this.maxHealth=s.hp;
    this.radius=s.radius; this.score=s.score;
    this.color=s.color; this.eyeColor=s.eyeColor;
    this.vx=0; this.vy=0; this.angle=0;
    this.state='idle';
    this.shootCooldown=rand(1.0,2.5);
    this.hitFlashTimer=0;
    this.wobble=0;
    this.alive=true;
    this.deathTimer=0;
    this.aggroShown=0;
    // Boss-specific
    this.isBoss=false; this.bossKey=null; this.bossName=''; this.bossTimer=0; this.teleported=false;
    // Sith-specific
    this.dashTimer=0; this.dashCooldown=rand(2,4);
  }
  update(dt, player) {
    if (!this.alive) { this.deathTimer+=dt; return; }
    this.hitFlashTimer=Math.max(0,this.hitFlashTimer-dt);
    this.wobble+=dt*6;
    if (this.aggroShown>0) this.aggroShown-=dt;

    const d = dist(this,player);
    if (this.state==='idle' && d < AGGRO_RANGE) { this.state='chase'; this.aggroShown=0.8; }

    if (this.state==='chase'||this.state==='attack') {
      const dx=player.x-this.x, dy=player.y-this.y;
      const dd=Math.hypot(dx,dy)||1;
      this.angle=Math.atan2(dy,dx);

      // TIE Fighter (ranged shooter)
      if (this.type==='tie_fighter') {
        if (d < 220) {
          this.state='attack';
          this.vx*=0.9; this.vy*=0.9;
          this.shootCooldown-=dt;
          if (this.shootCooldown<=0 && player.alive) {
            this.shootCooldown=rand(1.6,2.4);
            const a=this.angle+rand(-0.1,0.1);
            bullets.push(new Bullet(this.x+Math.cos(a)*20,this.y+Math.sin(a)*20,Math.cos(a)*ENEMY_BULLET_SPEED,Math.sin(a)*ENEMY_BULLET_SPEED,false));
            sfx.enemyShoot();
          }
          return;
        } else { this.state='chase'; }
      }

      // Sith: dashes toward player
      if (this.type==='sith') {
        this.dashTimer-=dt;
        this.dashCooldown-=dt;
        if (this.dashCooldown<=0 && this.dashTimer<=0) {
          this.dashTimer=0.25; this.dashCooldown=rand(2.5,4.0);
          const a=this.angle;
          this.vx=Math.cos(a)*this.speed*4; this.vy=Math.sin(a)*this.speed*4;
        } else if (this.dashTimer>0) {
          // keep dash velocity
        } else {
          this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed;
        }
      } else if (this.isBoss) {
        this.bossTimer+=dt;
        // Boss-specific attacks
        if (this.bossKey==='darth_vader') {
          // Force push every 3s: 3 slow bullets in front cone
          if (this.bossTimer>=3.0 && player.alive) {
            this.bossTimer=0;
            for(let i=-1;i<=1;i++){
              const a=this.angle+i*0.35;
              bullets.push(new Bullet(this.x+Math.cos(a)*30,this.y+Math.sin(a)*30,Math.cos(a)*130,Math.sin(a)*130,false));
            }
            sfx.enemyShoot();
          }
          this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed;
        } else if (this.bossKey==='boba_fett') {
          // Ranged; teleports when below 50% HP
          if (this.health<this.maxHealth*0.5 && !this.teleported) {
            this.teleported=true;
            this.x=rand(WALL_PAD+50,W-WALL_PAD-50);
            this.y=rand(WALL_PAD+50,H-WALL_PAD-50);
            for(let i=0;i<8;i++){const a=rand(0,Math.PI*2);particles.push(new Particle(this.x,this.y,Math.cos(a)*80,Math.sin(a)*80,'spark',0.3,3,'#ffdd00'));}
          }
          if (d<250) {
            this.state='attack'; this.vx*=0.88; this.vy*=0.88;
            this.shootCooldown-=dt;
            if (this.shootCooldown<=0 && player.alive) {
              this.shootCooldown=rand(1.0,1.8);
              const a=this.angle+rand(-0.08,0.08);
              bullets.push(new Bullet(this.x+Math.cos(a)*25,this.y+Math.sin(a)*25,Math.cos(a)*ENEMY_BULLET_SPEED,Math.sin(a)*ENEMY_BULLET_SPEED,false));
              sfx.enemyShoot();
            }
            return;
          } else { this.state='chase'; this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed; }
        } else if (this.bossKey==='emperor') {
          // Lightning spread: 6 bullets in arc every 2.5s
          if (this.bossTimer>=2.5 && player.alive) {
            this.bossTimer=0;
            for(let i=0;i<6;i++){
              const a=this.angle+(i-2.5)*0.22;
              const b=new Bullet(this.x+Math.cos(a)*26,this.y+Math.sin(a)*26,Math.cos(a)*ENEMY_BULLET_SPEED*1.1,Math.sin(a)*ENEMY_BULLET_SPEED*1.1,false);
              b.damage=8; bullets.push(b);
            }
            sfx.enemyShoot();
          }
          this.vx*=0.92; this.vy*=0.92; // Emperor floats slowly
          if (d>180) { this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed; }
        } else if (this.bossKey==='at_at') {
          // AT-AT: very slow, shoots heavy bolts every 2s
          if (this.bossTimer>=2.0 && player.alive) {
            this.bossTimer=0;
            const a=this.angle+rand(-0.15,0.15);
            const b=new Bullet(this.x+Math.cos(a)*40,this.y+Math.sin(a)*40,Math.cos(a)*ENEMY_BULLET_SPEED*0.8,Math.sin(a)*ENEMY_BULLET_SPEED*0.8,false);
            b.damage=20; b.radius=8; bullets.push(b);
            sfx.enemyShoot();
          }
          this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed;
        }
      } else {
        this.vx=(dx/dd)*this.speed; this.vy=(dy/dd)*this.speed;
      }
    }

    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // Padded boundary — enemies stay away from walls
    const pad = this.isBoss ? this.radius : this.radius+WALL_PAD;
    this.x=clamp(this.x, pad, W-pad);
    this.y=clamp(this.y, pad, H-pad);
    // Wall repulsion
    if (!this.isBoss) {
      const thresh=WALL_PAD*1.5;
      const wx = this.x - pad < thresh ? 28*(1-(this.x-pad)/thresh) : this.x > W-pad-thresh ? -28*(1-(W-pad-this.x)/thresh) : 0;
      const wy = this.y - pad < thresh ? 28*(1-(this.y-pad)/thresh) : this.y > H-pad-thresh ? -28*(1-(H-pad-this.y)/thresh) : 0;
      this.vx+=wx; this.vy+=wy;
    }
  }
  takeDamage(dmg) {
    this.health-=dmg;
    this.hitFlashTimer=HIT_FLASH_TIME;
    if (this.health<=0) {
      this.health=0; this.alive=false;
      spawnDeathParticles(this.x,this.y, this.isBoss ? this.bossKey : this.type);
      scorePopups.push(new ScorePopup(this.x,this.y-20,this.score));
      gameState.score+=this.score;
      const earned = this.isBoss ? 150 : Math.floor(this.score/10);
      gameState.credits += earned;
      localStorage.setItem('rogue_cr', gameState.credits);
      sfx.explosion(this.type==='at_st'||this.isBoss);

      // ── Kill streak tracking ──
      const now = gameState.titleTime;
      if (now - gameState.lastKillTime < 1.5) {
        gameState.killStreak = (gameState.killStreak||0) + 1;
      } else {
        gameState.killStreak = 1;
      }
      gameState.lastKillTime = now;
      // Streak health rewards
      if (gameState.killStreak===3) {
        player.health=Math.min(player.maxHealth, player.health+10);
        scorePopups.push(new ScorePopup(player.x, player.y-30, '🔥 x3 STREAK +10HP'));
      } else if (gameState.killStreak===5) {
        player.health=Math.min(player.maxHealth, player.health+20);
        scorePopups.push(new ScorePopup(player.x, player.y-30, '🔥 x5 STREAK +20HP'));
      } else if (gameState.killStreak>=7 && gameState.killStreak%2===1) {
        player.health=Math.min(player.maxHealth, player.health+30);
        scorePopups.push(new ScorePopup(player.x, player.y-30, `🔥 x${gameState.killStreak} STREAK +30HP`));
      }

      // ── Item drops ──
      if (this.isBoss) {
        // Boss always drops a health pack + shield
        spawnPickup(this.x, this.y, 'health');
        spawnPickup(this.x+30, this.y, 'shield');
      } else {
        const roll = Math.random();
        if (roll < 0.12)      spawnPickup(this.x, this.y, 'health');
        else if (roll < 0.20) spawnPickup(this.x, this.y, 'shield');
        else if (roll < 0.26) spawnPickup(this.x, this.y, 'speed');
      }

      if (this.isBoss) {
        gameState.bossKilled=true;
        // short delay before weapon select
        setTimeout(prepareWeaponSelect, 800);
      }
    } else {
      sfx.enemyHit();
    }
  }
  draw(ctx) {
    if (!this.alive && this.deathTimer>=ENEMY_DEATH_DURATION) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    if (!this.alive) {
      const t = this.deathTimer/ENEMY_DEATH_DURATION;
      ctx.globalAlpha=Math.max(0,1-t);
      ctx.scale(1+t*2,1+t*2);
    }

    ctx.rotate(this.angle);
    const flash=this.hitFlashTimer>0;
    const wb=Math.sin(this.wobble)*1.5;

    // Shadow
    ctx.save(); ctx.rotate(-this.angle);
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0,4,this.radius*0.9,this.radius*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    if (this.type==='stormtrooper') {
      // White armor body
      ctx.fillStyle=flash?'#fff':this.color;
      ctx.fillRect(-11,-11+wb,22,22);
      if(!flash){ctx.fillStyle='#aaaaaa';ctx.fillRect(-7,-7+wb,14,14);}
      // Pauldron arms
      ctx.fillStyle=flash?'#fff':'#999';
      ctx.fillRect(-16,-10+wb,7,5); ctx.fillRect(-16,5+wb,7,5);
      // T-visor helmet slit
      ctx.fillStyle=flash?'#f00':'#111';
      ctx.fillRect(3,-4+wb,9,3);
      ctx.fillStyle=flash?'#f00':this.eyeColor;
      ctx.fillRect(3,-5+wb,4,2); ctx.fillRect(8,-5+wb,4,2);

    } else if (this.type==='probe_droid') {
      // Dark floating sphere with sensor arms
      ctx.fillStyle=flash?'#fff':this.color;
      ctx.beginPath(); ctx.arc(0,0+wb,this.radius,0,Math.PI*2); ctx.fill();
      if(!flash){
        ctx.fillStyle='#111';
        ctx.beginPath(); ctx.arc(0,0+wb,this.radius-3,0,Math.PI*2); ctx.fill();
        // sensor spikes
        ctx.strokeStyle='#445'; ctx.lineWidth=1.5;
        for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]){
          ctx.beginPath();ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9+wb);ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15+wb);ctx.stroke();
        }
      }
      ctx.fillStyle=flash?'#f00':this.eyeColor;
      ctx.beginPath(); ctx.arc(4,0+wb,3,0,Math.PI*2); ctx.fill();

    } else if (this.type==='at_st') {
      // Walker legs + box head
      ctx.fillStyle=flash?'#fff':this.color;
      // body box
      ctx.fillRect(-14,-14+wb,28,20);
      if(!flash){ctx.fillStyle='#404830';ctx.fillRect(-10,-10+wb,20,14);}
      // legs (two vertical struts)
      ctx.fillStyle=flash?'#fff':'#4a5038';
      ctx.fillRect(-8,6+wb,4,14); ctx.fillRect(4,6+wb,4,14);
      ctx.fillRect(-10,18+wb,7,3); ctx.fillRect(3,18+wb,7,3);
      // twin front cannons
      ctx.fillStyle=flash?'#fff':'#333';
      ctx.fillRect(10,-8+wb,14,3); ctx.fillRect(10,-3+wb,14,3);
      // eyes
      ctx.fillStyle=flash?'#f00':this.eyeColor;
      ctx.fillRect(-8,-10+wb,6,4); ctx.fillRect(2,-10+wb,6,4);

    } else if (this.type==='tie_fighter') {
      // Hexagonal cockpit + two wing panels
      ctx.fillStyle=flash?'#fff':this.color;
      // cockpit
      const r=this.radius-3;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r+wb);}
      ctx.closePath(); ctx.fill();
      // wings
      ctx.fillStyle=flash?'#fff':'#0a0a1a';
      ctx.fillRect(-22,-14+wb,8,28); ctx.fillRect(14,-14+wb,8,28);
      if(!flash){ctx.strokeStyle='#334';ctx.lineWidth=1;ctx.strokeRect(-22,-14+wb,8,28);ctx.strokeRect(14,-14+wb,8,28);}
      // cockpit window
      ctx.fillStyle=flash?'#f00':this.eyeColor;
      ctx.beginPath(); ctx.arc(0,0+wb,r-4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,0+wb,r-7,0,Math.PI*2); ctx.fill();

    } else if (this.type==='sith') {
      // Dark robed figure with red saber glow
      ctx.fillStyle=flash?'#fff':this.color;
      ctx.fillRect(-10,-12+wb,20,24);
      if(!flash){
        ctx.fillStyle='#220000'; ctx.fillRect(-7,-9+wb,14,18);
        // robe hood
        ctx.fillStyle=this.color;
        ctx.beginPath();ctx.arc(0,-12+wb,8,Math.PI,0);ctx.fill();
      }
      // Red lightsaber
      if(!flash){
        const grd=ctx.createLinearGradient(10,-2+wb,22,-2+wb);
        grd.addColorStop(0,'#ff0000'); grd.addColorStop(1,'rgba(255,0,0,0)');
        ctx.fillStyle=grd; ctx.fillRect(10,-2+wb,14,4);
        ctx.fillStyle='#ff4444'; ctx.fillRect(10,-1+wb,12,2);
      }
      // eyes (hidden in hood)
      ctx.fillStyle=flash?'#f00':this.eyeColor;
      ctx.fillRect(2,-11+wb,4,2); ctx.fillRect(7,-11+wb,4,2);

    } else if (this.isBoss) {
      if (this.bossKey==='darth_vader') {
        // Large black armored figure
        ctx.fillStyle=flash?'#fff':this.color;
        ctx.fillRect(-20,-20+wb,40,40);
        if(!flash){
          ctx.fillStyle='#1a1a1a'; ctx.fillRect(-14,-14+wb,28,28);
          // chest panel
          ctx.fillStyle='#333'; ctx.fillRect(-10,-5+wb,10,14); ctx.fillRect(2,-5+wb,8,14);
        }
        // Cape
        ctx.fillStyle=flash?'#fff':'#0a0a0a';
        ctx.fillRect(-24,-18+wb,6,36); ctx.fillRect(18,-18+wb,6,36);
        // Iconic helmet dome
        ctx.fillStyle=flash?'#fff':'#111';
        ctx.beginPath();ctx.arc(0,-18+wb,16,Math.PI,0);ctx.fill();
        ctx.fillStyle=flash?'#fff':'#000';
        ctx.fillRect(-14,-22+wb,28,8);
        // Red eyes
        ctx.fillStyle='#ff0000';
        ctx.fillRect(-8,-16+wb,6,4); ctx.fillRect(2,-16+wb,6,4);
        // Red lightsaber
        if(!flash){
          const grd=ctx.createLinearGradient(20,-3+wb,44,-3+wb);
          grd.addColorStop(0,'#ff0000'); grd.addColorStop(1,'rgba(180,0,0,0.1)');
          ctx.fillStyle=grd; ctx.fillRect(20,-3+wb,26,6);
        }

      } else if (this.bossKey==='boba_fett') {
        // Green Mandalorian armor
        ctx.fillStyle=flash?'#fff':this.color;
        ctx.fillRect(-16,-16+wb,32,32);
        if(!flash){
          ctx.fillStyle='#2a5030'; ctx.fillRect(-11,-11+wb,22,22);
          // jetpack
          ctx.fillStyle='#4a3020'; ctx.fillRect(-6,-20+wb,12,10);
        }
        // T-visor
        ctx.fillStyle=flash?'#f00':'#111';
        ctx.fillRect(-12,-18+wb,24,5);
        ctx.fillStyle=flash?'#ff0':this.eyeColor;
        ctx.fillRect(-10,-18+wb,8,3); ctx.fillRect(2,-18+wb,8,3);
        // dual blasters
        ctx.fillStyle=flash?'#fff':'#333';
        ctx.fillRect(14,-10+wb,12,4); ctx.fillRect(14,6+wb,12,4);

      } else if (this.bossKey==='emperor') {
        // Hooded dark figure with purple lightning aura
        ctx.fillStyle=flash?'#fff':this.color;
        ctx.beginPath();ctx.arc(0,0+wb,this.radius,0,Math.PI*2);ctx.fill();
        if(!flash){
          ctx.fillStyle='#0f0520';
          ctx.beginPath();ctx.arc(0,0+wb,this.radius-4,0,Math.PI*2);ctx.fill();
          // Lightning aura
          ctx.strokeStyle=`rgba(170,0,255,${0.4+0.3*Math.sin(this.wobble*2)})`;
          ctx.lineWidth=2;
          for(let i=0;i<6;i++){
            const a=i*Math.PI/3+this.wobble*0.3;
            ctx.beginPath();ctx.moveTo(Math.cos(a)*(this.radius-2),Math.sin(a)*(this.radius-2)+wb);
            ctx.lineTo(Math.cos(a)*(this.radius+8),Math.sin(a)*(this.radius+8)+wb);ctx.stroke();
          }
        }
        ctx.fillStyle=flash?'#f00':this.eyeColor;
        ctx.beginPath();ctx.arc(-5,-4+wb,4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(5,-4+wb,4,0,Math.PI*2);ctx.fill();

      } else if (this.bossKey==='at_at') {
        // Huge walker
        ctx.fillStyle=flash?'#fff':this.color;
        ctx.fillRect(-30,-22+wb,60,32);
        if(!flash){
          ctx.fillStyle='#4a4a3a'; ctx.fillRect(-24,-16+wb,48,22);
          // armor plates
          ctx.strokeStyle='#666'; ctx.lineWidth=1.5;
          ctx.strokeRect(-28,-20+wb,58,30);
        }
        // Four legs
        ctx.fillStyle=flash?'#fff':'#5a5a48';
        ctx.fillRect(-22,10+wb,6,22); ctx.fillRect(-10,10+wb,6,22);
        ctx.fillRect(6,10+wb,6,22);  ctx.fillRect(18,10+wb,6,22);
        // Foot pads
        ctx.fillStyle=flash?'#fff':'#444';
        for(const lx of[-25,-13,3,15]) ctx.fillRect(lx,30+wb,10,5);
        // Twin head cannons
        ctx.fillStyle=flash?'#fff':'#333';
        ctx.fillRect(22,-12+wb,18,5); ctx.fillRect(22,-5+wb,18,5);
        // Eyes
        ctx.fillStyle=flash?'#f00':this.eyeColor;
        ctx.fillRect(-18,-16+wb,8,5); ctx.fillRect(-4,-16+wb,8,5);
      }
    }

    // Aggro "!" indicator
    if (this.aggroShown > 0) {
      ctx.save(); ctx.rotate(-this.angle);
      ctx.globalAlpha=Math.min(1,this.aggroShown*3);
      ctx.fillStyle='#ffdd00';
      ctx.font='bold 14px monospace';
      ctx.textAlign='center';
      ctx.fillText('!', 0, -this.radius-8);
      ctx.restore();
    }

    // Health bar (for tough enemies)
    if ((this.maxHealth>2 || this.isBoss) && this.alive) {
      ctx.save(); ctx.rotate(-this.angle);
      const bw=this.radius*2+4, bh=4;
      ctx.fillStyle='#333';
      ctx.fillRect(-bw/2, this.radius+4, bw, bh);
      ctx.fillStyle='#e74c3c';
      ctx.fillRect(-bw/2, this.radius+4, bw*(this.health/this.maxHealth), bh);
      ctx.restore();
    }

    ctx.restore();
  }
}

// ─── GAME STATE ──────────────────────────────────────────────────────────────
let player, enemies, bullets, particles, scorePopups, pickups;
const WEAPON_PRICES = {
  blaster: 0, dual: 200, rapidFire: 350, shotgun: 500, ionCannon: 800, lightsaber: 1200
};

const gameState = {
  _musicBtns: {},
  current: 'lobby',
  level: 1,
  score: 0,
  highScore: parseInt(localStorage.getItem('rogue_hs'))||0,
  credits: parseInt(localStorage.getItem('rogue_cr'))||0,
  ownedWeapons: ['blaster'],
  spawnQueue: [],
  spawnTimer: 0,
  spawnDelay: 2.0,
  levelCompleteTimer: 0,
  overlayAlpha: 0,
  titleTime: 0,
  weapon: 'blaster',
  bossActive: false,
  bossKilled: false,
  landscape: 'space',
  weaponSelectOptions: [],
  landscapeFlash: 0,
};

function getLevelConfig(n) {
  if (n <= LEVELS.length) return LEVELS[n-1];
  const extra = n - LEVELS.length;
  return { count:15+extra*3, types:['stormtrooper','probe_droid','at_st','tie_fighter','sith'], spawnDelay:Math.max(0.6,1.0-extra*0.05), boss:true };
}

function buildSpawnQueue(config) {
  const q = [];
  const types = config.types;
  for (let i=0;i<config.count;i++) q.push(types[Math.floor(Math.random()*types.length)]);
  // shuffle
  for (let i=q.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q[i],q[j]]=[q[j],q[i]]; }
  return q;
}

function startGame() {
  player = new Player();
  enemies = []; bullets = []; particles = []; scorePopups = []; pickups = [];
  gameState.score = 0;
  gameState.level = 1;
  gameState.killStreak = 0;
  gameState.lastKillTime = 0;
  gameState.shieldTimer = 0;
  gameState.speedBoostTimer = 0;
  startLevel();
  gameState.current = 'playing';
}

function startLevel() {
  const cfg = getLevelConfig(gameState.level);
  gameState.spawnQueue = buildSpawnQueue(cfg);
  gameState.spawnDelay = cfg.spawnDelay;
  gameState.spawnTimer = 0.8;
  gameState.bossActive = false;
  gameState.bossKilled = false;
  gameState.hasBoss = cfg.boss || false;
  bullets = []; pickups = [];
  player.x = W/2; player.y = H/2;
  // Set landscape every 3 levels
  const themes = ['space','tatooine','endor','hoth'];
  const newLandscape = themes[Math.floor((gameState.level-1)/3) % themes.length];
  if (newLandscape !== gameState.landscape) {
    gameState.landscape = newLandscape;
    gameState.landscapeFlash = 2.5;
  } else {
    gameState.landscape = newLandscape;
  }
}

function nextLevel() {
  gameState.level++;
  particles = []; scorePopups = [];
  startLevel();
  gameState.current = 'playing';
  gameState.overlayAlpha = 0;
}

function spawnBoss() {
  const bossKey = BOSS_ORDER[(gameState.level - 2) % BOSS_ORDER.length];
  const bstat = BOSS_STATS[bossKey];
  // Scale HP for levels beyond 5
  const scale = gameState.level > BOSS_ORDER.length + 1 ? 1 + 0.15*(gameState.level - BOSS_ORDER.length - 1) : 1;
  const boss = new Enemy(W/2, -60, 'boss');
  boss.isBoss = true;
  boss.bossKey = bossKey;
  boss.bossName = bstat.name;
  boss.speed = bstat.speed;
  boss.health = Math.round(bstat.hp * scale);
  boss.maxHealth = boss.health;
  boss.radius = bstat.radius;
  boss.score = bstat.score;
  boss.color = bstat.color;
  boss.eyeColor = bstat.eyeColor;
  boss.bossTimer = 0;
  boss.teleported = false;
  enemies.push(boss);
  gameState.bossActive = true;
  gameState.bossRef = boss;
  sfx.explosion(true);
}

function prepareWeaponSelect() {
  const all = Object.keys(WEAPONS);
  const others = all.filter(k => k !== gameState.weapon);
  // pick 3 random options
  const opts = [];
  const pool = [...others];
  while (opts.length < 3 && pool.length > 0) {
    const i = Math.floor(Math.random()*pool.length);
    opts.push(pool.splice(i,1)[0]);
  }
  gameState.weaponSelectOptions = opts;
  gameState.current = 'weaponSelect';
}

// ─── COLLISION ───────────────────────────────────────────────────────────────
function circleHit(a, b) { return dist(a,b) < a.radius+b.radius; }

function handleCollisions() {
  // Bullets vs enemies / player
  for (const b of bullets) {
    if (!b.alive) continue;
    if (b.fromPlayer) {
      for (const e of enemies) {
        if (!e.alive||!b.alive) continue;
        if (circleHit(b,e)) {
          if (!b.pierce) b.alive=false;
          e.takeDamage(b.damage);
          spawnHitParticles(b.x,b.y);
        }
      }
    } else {
      const dmg = b.damage || 10;
      if (player.alive && circleHit(b,player)) {
        b.alive=false; player.takeDamage(dmg); spawnHitParticles(b.x,b.y);
      }
    }
  }

  // Enemies vs player (melee)
  for (const e of enemies) {
    if (!e.alive) continue;
    if (player.alive && circleHit(e,player)) player.takeDamage(12);
  }

  // Pickups vs player
  for (const p of pickups) {
    if (!p.alive) continue;
    if (player.alive && dist(p, player) < p.radius + player.radius) {
      p.alive = false;
      if (p.type==='health') {
        const gain = Math.min(25, player.maxHealth - player.health);
        player.health += gain;
        scorePopups.push(new ScorePopup(player.x, player.y-30, `+${gain} HP`));
        sfx.playerHit(); // repurpose as pickup chime (short)
      } else if (p.type==='shield') {
        gameState.shieldTimer = 4.0;
        player.invincibleTimer = 4.0;
        scorePopups.push(new ScorePopup(player.x, player.y-30, 'SHIELD ON!'));
      } else if (p.type==='speed') {
        gameState.speedBoostTimer = 6.0;
        scorePopups.push(new ScorePopup(player.x, player.y-30, 'SPEED UP!'));
      }
    }
  }

  // Enemy separation
  for (let i=0;i<enemies.length;i++) {
    if (!enemies[i].alive) continue;
    for (let j=i+1;j<enemies.length;j++) {
      if (!enemies[j].alive) continue;
      const ei=enemies[i], ej=enemies[j];
      const minD=ei.radius+ej.radius+4;
      const d=dist(ei,ej);
      if (d<minD && d>0) {
        const force=(1-d/minD)*55;
        const dx=(ei.x-ej.x)/d, dy=(ei.y-ej.y)/d;
        ei.vx+=dx*force; ei.vy+=dy*force;
        ej.vx-=dx*force; ej.vy-=dy*force;
      }
    }
  }
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
function update(dt) {
  gameState.titleTime+=dt;

  if (gameState.current==='lobby') {
    if (Math.random()<0.1) {
      particles.push(new Particle(rand(0,W),H+10, rand(-20,20),rand(-80,-30),'spark',rand(1.5,3.0),rand(1,3),'#ff4444'));
    }
    particles.forEach(p=>p.update(dt));
    particles=particles.filter(p=>p.life>0&&p.y>-20);
    return;
  }

  if (gameState.current==='gameOver') {
    particles.forEach(p=>p.update(dt));
    particles=particles.filter(p=>p.life>0);
    if (input.clicked) { input.clicked=false; gameState.current='lobby'; particles=[]; }
    return;
  }

  if (gameState.current==='levelComplete') {
    gameState.overlayAlpha=Math.min(0.75,gameState.overlayAlpha+dt*2);
    gameState.levelCompleteTimer-=dt;
    particles.forEach(p=>p.update(dt));
    particles=particles.filter(p=>p.life>0);
    if (input.clicked||gameState.levelCompleteTimer<=0) {
      input.clicked=false;
      if (gameState.level % 3 === 0) {
        gameState.current='shop';
      } else {
        nextLevel();
      }
    }
    return;
  }

  if (gameState.current==='shop') {
    // handled by click detection in mousedown
    return;
  }

  if (gameState.current==='weaponSelect') {
    if (input.clicked) {
      input.clicked=false;
      // Check weapon card clicks (handled in draw, selection via gameState._weaponCardHit)
      if (gameState._weaponCardHit) {
        gameState.weapon = gameState._weaponCardHit;
        gameState._weaponCardHit = null;
        gameState.current='levelComplete';
        gameState.levelCompleteTimer=3.0;
        gameState.overlayAlpha=0;
        sfx.levelComplete();
      }
    }
    return;
  }

  // ── PLAYING ──
  input.clicked=false;

  // Spawn
  gameState.spawnTimer-=dt;
  if (gameState.spawnTimer<=0 && gameState.spawnQueue.length>0) {
    const type=gameState.spawnQueue.shift();
    const pos=spawnEdgePos();
    enemies.push(new Enemy(pos.x,pos.y,type));
    gameState.spawnTimer=gameState.spawnDelay;
    sfx.enemySpawn();
  }

  player.update(dt);

  // Buff timers
  if (gameState.shieldTimer>0)     gameState.shieldTimer     = Math.max(0, gameState.shieldTimer-dt);
  if (gameState.speedBoostTimer>0) gameState.speedBoostTimer = Math.max(0, gameState.speedBoostTimer-dt);

  for (const e of enemies) e.update(dt, player);
  for (const b of bullets) b.update(dt);
  for (const p of pickups) p.update(dt);
  particles.forEach(p=>p.update(dt));
  scorePopups.forEach(s=>s.update(dt));

  handleCollisions();

  // Cleanup
  bullets=bullets.filter(b=>b.alive);
  enemies=enemies.filter(e=>e.alive||e.deathTimer<ENEMY_DEATH_DURATION);
  particles=particles.filter(p=>p.life>0);
  scorePopups=scorePopups.filter(s=>s.life>0);
  pickups=pickups.filter(p=>p.alive);

  // Check win/lose
  if (!player.alive && player.deathTimer>0.6) {
    if (gameState.score>gameState.highScore) {
      gameState.highScore=gameState.score;
      localStorage.setItem('rogue_hs',gameState.highScore);
    }
    gameState.current='gameOver';
    sfx.gameOver();
  }

  const regularsDead = enemies.filter(e=>!e.isBoss).every(e=>!e.alive) && gameState.spawnQueue.length===0;
  const bossDead = !gameState.bossActive || (gameState.bossRef && !gameState.bossRef.alive);
  const allDead = regularsDead && bossDead && !gameState.bossKilled;

  // Spawn boss after wave clears (levels with boss, boss not yet active or killed)
  if (regularsDead && gameState.hasBoss && !gameState.bossActive && !gameState.bossKilled && player.alive) {
    if (!gameState._bossSpawnTimer) gameState._bossSpawnTimer=1.2;
    gameState._bossSpawnTimer-=dt;
    if (gameState._bossSpawnTimer<=0) {
      delete gameState._bossSpawnTimer;
      spawnBoss();
    }
  } else {
    gameState._bossSpawnTimer=undefined;
  }

  if (allDead && player.alive) {
    if (!gameState._levelEndTimer) gameState._levelEndTimer=0.8;
    gameState._levelEndTimer-=dt;
    if (gameState._levelEndTimer<=0) {
      delete gameState._levelEndTimer;
      gameState.current='levelComplete';
      gameState.levelCompleteTimer=4.0;
      gameState.overlayAlpha=0;
      sfx.levelComplete();
    }
  } else {
    gameState._levelEndTimer=undefined;
  }
}

// ─── DRAW ────────────────────────────────────────────────────────────────────
function drawBackground() {
  const ls = gameState.landscape || 'space';
  if (ls==='space') {
    ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#141428'; ctx.lineWidth=1;
    const gs=40;
    for(let x=0;x<W;x+=gs){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
    for(let y=0;y<H;y+=gs){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
    ctx.strokeStyle='#1a1a40'; ctx.lineWidth=3; ctx.strokeRect(1,1,W-2,H-2);

  } else if (ls==='tatooine') {
    ctx.fillStyle='#1a0d00'; ctx.fillRect(0,0,W,H);
    // Dune waves
    ctx.strokeStyle='#2a1800'; ctx.lineWidth=1.5;
    for(let i=0;i<8;i++){
      ctx.beginPath();
      const y0=80+i*70;
      for(let x=0;x<=W;x+=10){
        const y=y0+Math.sin(x/60+i*1.3)*12;
        i===0&&x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    // Twin suns
    ctx.save(); ctx.globalAlpha=0.15;
    ctx.fillStyle='#ff8800'; ctx.beginPath();ctx.arc(160,90,30,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffaa00'; ctx.beginPath();ctx.arc(220,110,22,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#3a1a00'; ctx.lineWidth=3; ctx.strokeRect(1,1,W-2,H-2);

  } else if (ls==='endor') {
    ctx.fillStyle='#010a01'; ctx.fillRect(0,0,W,H);
    // Tree silhouettes (seeded positions)
    ctx.fillStyle='#001200';
    const treeSeed=[0,7,-8,5,-3,11,-5,9,2,-11,6,-4,8,-6,3,-9,4,-7];
    let ti=0;
    for(let tx=20;tx<W;tx+=55,ti++){
      const th=130+(ti%4)*20, tx2=tx+treeSeed[ti%treeSeed.length];
      ctx.fillRect(tx2-4,H-th,8,th);
      ctx.beginPath();ctx.moveTo(tx2-22,H-th+30);ctx.lineTo(tx2,H-th-20);ctx.lineTo(tx2+22,H-th+30);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(tx2-16,H-th+5);ctx.lineTo(tx2,H-th-45);ctx.lineTo(tx2+16,H-th+5);ctx.closePath();ctx.fill();
    }
    ctx.strokeStyle='#002200'; ctx.lineWidth=3; ctx.strokeRect(1,1,W-2,H-2);

  } else if (ls==='hoth') {
    ctx.fillStyle='#080810'; ctx.fillRect(0,0,W,H);
    // Ice crystal grid
    ctx.strokeStyle='#0a1428'; ctx.lineWidth=1;
    const gs=50;
    for(let x=0;x<W;x+=gs){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
    for(let y=0;y<H;y+=gs){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
    // Ice shard accents
    ctx.save(); ctx.globalAlpha=0.07; ctx.fillStyle='#aaddff';
    for(let i=0;i<18;i++){
      const sx=((i*137)%W), sy=((i*89)%H);
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+8,sy-14);ctx.lineTo(sx+16,sy);ctx.closePath();ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle='#101828'; ctx.lineWidth=3; ctx.strokeRect(1,1,W-2,H-2);
  }

  // Landscape flash label when theme changes
  if (gameState.landscapeFlash>0) {
    gameState.landscapeFlash-=1/60;
    const alpha=Math.min(1,gameState.landscapeFlash)*0.85;
    const names={space:'DEEP SPACE',tatooine:'TATOOINE',endor:'ENDOR',hoth:'HOTH'};
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W/2-120,H/2-24,240,44);
    ctx.fillStyle='#f1c40f'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText('◆ '+names[ls]+' ◆',W/2,H/2+6);
    ctx.restore();
  }
}

function drawHUD() {
  // Top bar
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(0,0,W,44);
  // Bottom bar
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,H-32,W,32);

  // Health bar
  const hp=player.health/player.maxHealth;
  ctx.fillStyle='#1a1a1a'; ctx.fillRect(10,12,160,18);
  const hcolor = hp>0.6?'#2ecc71':hp>0.3?'#f39c12':'#e74c3c';
  ctx.fillStyle=hcolor; ctx.fillRect(10,12,160*hp,18);
  // Pulse effect at low hp
  if (hp<0.3) {
    ctx.save();
    ctx.globalAlpha=0.3+0.3*Math.sin(gameState.titleTime*8);
    ctx.fillStyle='#ff0000';
    ctx.fillRect(10,12,160*hp,18);
    ctx.restore();
  }
  ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(10,12,160,18);
  ctx.fillStyle='#fff'; ctx.font='bold 11px monospace'; ctx.textAlign='left';
  ctx.fillText(`HP  ${player.health} / ${player.maxHealth}`, 16, 25);

  // Level (imperial red)
  ctx.fillStyle='#ff4444'; ctx.font='bold 17px monospace'; ctx.textAlign='center';
  ctx.fillText(`— LEVEL ${gameState.level} —`, W/2, 27);

  // Score + Credits
  ctx.fillStyle='#f1c40f'; ctx.font='bold 14px monospace'; ctx.textAlign='right';
  ctx.fillText(`SCORE  ${gameState.score}`, W-10, 18);
  ctx.fillStyle='#88ddff'; ctx.font='bold 12px monospace';
  ctx.fillText(`⬡ ${gameState.credits} CR`, W-10, 34);

  // Bottom: enemies remaining
  const alive=enemies.filter(e=>e.alive).length;
  const remaining=alive+gameState.spawnQueue.length;
  ctx.fillStyle='#888'; ctx.font='12px monospace'; ctx.textAlign='left';
  ctx.fillText(`ENEMIES: ${remaining}`, 12, H-10);

  // Weapon indicator (bottom right)
  const w = WEAPONS[gameState.weapon] || WEAPONS.blaster;
  ctx.fillStyle=w.color; ctx.font='bold 12px monospace'; ctx.textAlign='right';
  ctx.fillText(`⚡ ${w.name}`, W-10, H-10);

  // Active buff indicators (right side, below score)
  let buffY = 50;
  if (gameState.shieldTimer>0) {
    ctx.fillStyle='#00e5ff'; ctx.font='bold 12px monospace'; ctx.textAlign='right';
    ctx.fillText(`◈ SHIELD  ${gameState.shieldTimer.toFixed(1)}s`, W-10, buffY);
    buffY+=18;
  }
  if (gameState.speedBoostTimer>0) {
    ctx.fillStyle='#f1c40f'; ctx.font='bold 12px monospace'; ctx.textAlign='right';
    ctx.fillText(`⚡ SPEED  ${gameState.speedBoostTimer.toFixed(1)}s`, W-10, buffY);
    buffY+=18;
  }

  // Kill streak display (left side, below HP bar)
  if ((gameState.killStreak||0) >= 2) {
    const streak = gameState.killStreak;
    const streakColor = streak>=7?'#ff4444':streak>=5?'#ff8800':streak>=3?'#ffdd00':'#aaa';
    ctx.fillStyle=streakColor; ctx.font='bold 12px monospace'; ctx.textAlign='left';
    ctx.fillText(`🔥 KILL STREAK x${streak}`, 12, 60);
  }

  // Music buttons: [OFF] [LOFI] [ROCK] [KPOP]
  const musicBtns = ['off','lofi','rock','kpop'];
  const btnLabels = {'off':'OFF','lofi':'LOFI','rock':'ROCK','kpop':'KPOP'};
  const btnColors = {'off':'#444','lofi':'#2980b9','rock':'#c0392b','kpop':'#8e44ad'};
  let bx = 12;
  const by = H - 28, bh = 18;
  musicBtns.forEach(m => {
    const lbl = '♪ '+btnLabels[m];
    ctx.font = 'bold 11px monospace';
    const bw = ctx.measureText(lbl).width + 14;
    const active = music.getMode() === m;
    ctx.fillStyle = active ? btnColors[m] : '#222';
    ctx.strokeStyle = active ? btnColors[m] : '#444';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = active ? '#fff' : '#888';
    ctx.textAlign = 'left';
    ctx.fillText(lbl, bx + 7, by + 13);
    gameState._musicBtns[m] = {x:bx, y:by, w:bw, h:bh};
    bx += bw + 6;
  });

  // Boss health bar
  if (gameState.bossActive && gameState.bossRef && gameState.bossRef.alive) {
    const boss=gameState.bossRef;
    const bw=W-80, bh=10, bx=40, by=H-60;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(bx-4,by-18,bw+8,bh+24);
    ctx.fillStyle='#ff0000'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText(`☠ ${boss.bossName} ☠`, W/2, by-4);
    ctx.fillStyle='#330000'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#cc0000'; ctx.fillRect(bx,by,bw*(boss.health/boss.maxHealth),bh);
    ctx.strokeStyle='#660000'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  }

  ctx.textAlign='left';
}

function drawCrosshair() {
  const mx=input.mx, my=input.my;
  ctx.save();
  ctx.translate(mx,my);
  ctx.strokeStyle='#00e5ff'; ctx.lineWidth=1.5;
  const g=5,l=11;
  ctx.beginPath();
  ctx.moveTo(-g-l,0); ctx.lineTo(-g,0);
  ctx.moveTo( g,0);   ctx.lineTo( g+l,0);
  ctx.moveTo(0,-g-l); ctx.lineTo(0,-g);
  ctx.moveTo(0, g);   ctx.lineTo(0, g+l);
  ctx.stroke();
  // Center dot
  ctx.fillStyle='#00e5ff';
  ctx.beginPath(); ctx.arc(0,0,1.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLobby() {
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);

  // Title
  ctx.save();
  ctx.font='bold 54px monospace'; ctx.textAlign='center';
  ctx.fillStyle='#400000';
  ctx.fillText('ROGUE SQUADRON', W/2+3, 90+3);
  const pulse=0.8+0.2*Math.sin(gameState.titleTime*2);
  ctx.fillStyle=`rgba(255,60,60,${pulse})`;
  ctx.fillText('ROGUE SQUADRON', W/2, 90);
  ctx.font='14px monospace'; ctx.fillStyle='rgba(255,200,0,0.8)';
  ctx.fillText('A STAR WARS ADVENTURE', W/2, 118);
  ctx.restore();

  // Subtitle
  ctx.fillStyle='#aaa'; ctx.font='13px monospace'; ctx.textAlign='center';
  ctx.fillText('CHOOSE YOUR STARTING WEAPON', W/2, 148);

  // Weapon cards — show blaster, dual, rapidFire (starter weapons)
  const starters = ['blaster','dual','rapidFire'];
  const cardW=200, cardH=170, gap=20;
  const totalW = starters.length*(cardW+gap)-gap;
  const sx = W/2 - totalW/2;
  gameState._lobbyCards = {};

  starters.forEach((key,i) => {
    const w=WEAPONS[key];
    const cx=sx+i*(cardW+gap), cy=170;
    const selected = gameState.weapon===key;
    const hover = input.mx>=cx&&input.mx<=cx+cardW&&input.my>=cy&&input.my<=cy+cardH;

    ctx.save();
    ctx.fillStyle = selected ? '#1a1028' : hover ? '#111122' : '#0a0a14';
    ctx.strokeStyle = selected ? w.color : hover ? '#444' : '#222';
    ctx.lineWidth = selected ? 2.5 : 1;
    ctx.beginPath(); ctx.roundRect(cx,cy,cardW,cardH,10); ctx.fill(); ctx.stroke();

    if (selected) {
      ctx.shadowColor=w.color; ctx.shadowBlur=14;
      ctx.strokeStyle=w.color; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.roundRect(cx,cy,cardW,cardH,10); ctx.stroke();
      ctx.shadowBlur=0;
    }

    ctx.fillStyle=w.color; ctx.font='bold 15px monospace'; ctx.textAlign='center';
    ctx.fillText(w.name, cx+cardW/2, cy+28);

    // Icon
    ctx.strokeStyle=w.color; ctx.lineWidth=2; ctx.save();
    ctx.translate(cx+cardW/2, cy+72);
    if (key==='lightsaber'){ ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(26,0);ctx.stroke(); }
    else if (key==='dual'){ ctx.beginPath();ctx.moveTo(-14,-7);ctx.lineTo(22,-7);ctx.stroke(); ctx.beginPath();ctx.moveTo(-14,7);ctx.lineTo(22,7);ctx.stroke(); }
    else { ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(22,0);ctx.stroke(); }
    ctx.restore();

    ctx.fillStyle='#666'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText(w.desc, cx+cardW/2, cy+102);
    ctx.fillText(`${Math.round(1/w.fireRate)} shots/s`, cx+cardW/2, cy+118);

    if (selected) {
      ctx.fillStyle=w.color; ctx.font='bold 12px monospace';
      ctx.fillText('✓ SELECTED', cx+cardW/2, cy+148);
    }
    ctx.restore();
    gameState._lobbyCards[key]={x:cx,y:cy,w:cardW,h:cardH};
  });

  // Credits display
  ctx.fillStyle='#88ddff'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
  ctx.fillText(`⬡ ${gameState.credits} CR available`, W/2, 362);
  if (Object.keys(WEAPON_PRICES).some(k=>gameState.ownedWeapons.includes(k)&&k!=='blaster'&&k!=='dual'&&k!=='rapidFire')) {
    ctx.fillStyle='#666'; ctx.font='11px monospace';
    ctx.fillText('You own additional weapons — available in the shop during play', W/2, 378);
  }

  // Launch button
  const bw=220, bh=44, bx=W/2-bw/2, by=400;
  const bhover = input.mx>=bx&&input.mx<=bx+bw&&input.my>=by&&input.my<=by+bh;
  ctx.fillStyle=bhover?'#cc0000':'#880000';
  ctx.strokeStyle='#ff4444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
  ctx.fillText('▶  LAUNCH MISSION', W/2, by+28);
  gameState._lobbyLaunch={x:bx,y:by,w:bw,h:bh};

  // High score + controls
  if(gameState.highScore>0) {
    ctx.fillStyle='#f1c40f'; ctx.font='13px monospace'; ctx.textAlign='center';
    ctx.fillText(`HIGH SCORE: ${gameState.highScore}`, W/2, 468);
  }
  ctx.fillStyle='#444'; ctx.font='11px monospace';
  ctx.fillText('WASD · MOUSE AIM · CLICK SHOOT', W/2, 488);
  ctx.textAlign='left';
}

function drawShop() {
  // Cantina/black market vibe
  ctx.fillStyle='rgba(0,0,0,0.92)'; ctx.fillRect(0,0,W,H);

  // Scanline texture
  ctx.save();
  ctx.globalAlpha=0.04;
  for(let y=0;y<H;y+=3){ ctx.fillStyle='#fff'; ctx.fillRect(0,y,W,1); }
  ctx.restore();

  // Header
  ctx.save();
  ctx.font='bold 28px monospace'; ctx.textAlign='center';
  ctx.fillStyle='#ffaa00';
  ctx.fillText('⬡  WEAPONS MARKET  ⬡', W/2, 44);
  ctx.font='13px monospace'; ctx.fillStyle='#88ddff';
  ctx.fillText(`YOUR CREDITS: ${gameState.credits} CR`, W/2, 66);
  ctx.font='12px monospace'; ctx.fillStyle='#555';
  ctx.fillText(`Level ${gameState.level} complete — next up: Level ${gameState.level+1}`, W/2, 84);
  ctx.restore();

  const allKeys = Object.keys(WEAPONS);
  const cardW=130, cardH=160, gap=14;
  const totalW = allKeys.length*(cardW+gap)-gap;
  const sx = W/2-totalW/2;
  const cy = 105;
  gameState._shopHitZones = [];

  allKeys.forEach((key,i) => {
    const w=WEAPONS[key];
    const price=WEAPON_PRICES[key];
    const owned=gameState.ownedWeapons.includes(key);
    const equipped=gameState.weapon===key;
    const canAfford=gameState.credits>=price;
    const cx=sx+i*(cardW+gap);

    const hover=input.mx>=cx&&input.mx<=cx+cardW&&input.my>=cy&&input.my<=cy+cardH;

    ctx.save();
    ctx.fillStyle=equipped?'#1a1028':owned?'#0a1a0a':canAfford?'#0d0d18':'#0a0a0a';
    ctx.strokeStyle=equipped?w.color:owned?'#2ecc71':canAfford?'#333':'#1a1a1a';
    ctx.lineWidth=equipped?2:1;
    ctx.beginPath(); ctx.roundRect(cx,cy,cardW,cardH,8); ctx.fill(); ctx.stroke();

    // Name
    ctx.fillStyle=owned?w.color:'#777'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText(w.name, cx+cardW/2, cy+18);

    // Icon
    ctx.strokeStyle=owned?w.color:'#444'; ctx.lineWidth=1.5; ctx.save();
    ctx.translate(cx+cardW/2, cy+52);
    if (key==='lightsaber'){ctx.strokeStyle=owned?'#00ff00':'#224422';ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();}
    else if (key==='shotgun'){for(let s=-2;s<=2;s++){ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(18,s*6);ctx.stroke();}}
    else if (key==='dual'){ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(18,-6);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,6);ctx.lineTo(18,6);ctx.stroke();}
    else if (key==='ionCannon'){ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(18,0);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(18,0);ctx.stroke();}
    ctx.restore();

    // Desc
    ctx.fillStyle='#555'; ctx.font='9px monospace'; ctx.textAlign='center';
    ctx.fillText(w.desc, cx+cardW/2, cy+78);

    // Status / price
    if (equipped) {
      ctx.fillStyle='#aa88ff'; ctx.font='bold 10px monospace';
      ctx.fillText('EQUIPPED', cx+cardW/2, cy+100);
    } else if (owned) {
      ctx.fillStyle='#2ecc71'; ctx.font='bold 10px monospace';
      ctx.fillText('OWNED', cx+cardW/2, cy+94);
      // Equip button
      const bx2=cx+10, by2=cy+104, bw2=cardW-20, bh2=22;
      const bhov=input.mx>=bx2&&input.mx<=bx2+bw2&&input.my>=by2&&input.my<=by2+bh2;
      ctx.fillStyle=bhov?'#2ecc71':'#1a6630'; ctx.strokeStyle='#2ecc71'; ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(bx2,by2,bw2,bh2,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 10px monospace';
      ctx.fillText('EQUIP', cx+cardW/2, by2+15);
      gameState._shopHitZones.push({x:bx2,y:by2,w:bw2,h:bh2,action:()=>{gameState.weapon=key;}});
    } else if (price===0) {
      ctx.fillStyle='#2ecc71'; ctx.font='10px monospace';
      ctx.fillText('FREE', cx+cardW/2, cy+100);
    } else {
      ctx.fillStyle=canAfford?'#f1c40f':'#663300'; ctx.font='bold 11px monospace';
      ctx.fillText(`${price} CR`, cx+cardW/2, cy+96);
      if (canAfford) {
        const bx2=cx+8, by2=cy+106, bw2=cardW-16, bh2=24;
        const bhov=input.mx>=bx2&&input.mx<=bx2+bw2&&input.my>=by2&&input.my<=by2+bh2;
        ctx.fillStyle=bhov?'#cc9900':'#7a5800'; ctx.strokeStyle='#f1c40f'; ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(bx2,by2,bw2,bh2,4);ctx.fill();ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font='bold 10px monospace';
        ctx.fillText('BUY', cx+cardW/2, by2+16);
        gameState._shopHitZones.push({x:bx2,y:by2,w:bw2,h:bh2,action:()=>{
          gameState.credits-=price;
          localStorage.setItem('rogue_cr',gameState.credits);
          gameState.ownedWeapons.push(key);
          gameState.weapon=key;
        }});
      } else {
        ctx.fillStyle='#441100'; ctx.font='9px monospace';
        ctx.fillText('NEED MORE CR', cx+cardW/2, cy+110);
      }
    }
    ctx.restore();
  });

  // Continue button
  const bw=240, bh=46, bx=W/2-bw/2, by=H-80;
  const bhov=input.mx>=bx&&input.mx<=bx+bw&&input.my>=by&&input.my<=by+bh;
  ctx.fillStyle=bhov?'#004499':'#002266';
  ctx.strokeStyle='#00aaff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText(`▶  ENTER LEVEL ${gameState.level+1}`, W/2, by+30);
  gameState._shopHitZones.push({x:bx,y:by,w:bw,h:bh,action:()=>{ nextLevel(); }});

  ctx.textAlign='left';
}

function drawLevelComplete() {
  ctx.fillStyle=`rgba(0,0,0,${gameState.overlayAlpha})`;
  ctx.fillRect(0,0,W,H);
  if(gameState.overlayAlpha>0.4) {
    ctx.save();
    ctx.font='bold 46px monospace'; ctx.textAlign='center';
    ctx.fillStyle='#155724';
    ctx.fillText('SECTOR SECURED!', W/2+2, H/2-38+2);
    ctx.fillStyle='#2ecc71';
    ctx.fillText('SECTOR SECURED!', W/2, H/2-38);

    ctx.fillStyle='#fff'; ctx.font='22px monospace';
    ctx.fillText(`SCORE: ${gameState.score}`, W/2, H/2+12);

    ctx.fillStyle='#888'; ctx.font='15px monospace';
    const blink=Math.floor(gameState.titleTime*2)%2===0;
    if(blink) ctx.fillText('CLICK TO CONTINUE', W/2, H/2+52);

    ctx.fillStyle='#ff4444'; ctx.font='bold 16px monospace';
    if (gameState.level % 3 === 0) {
      ctx.fillStyle='#ffaa00';
      ctx.fillText('⬡  WEAPONS MARKET OPENS  ⬡', W/2, H/2+82);
    } else {
      ctx.fillText(`LEVEL ${gameState.level+1} INCOMING...`, W/2, H/2+82);
    }
    ctx.restore();
    ctx.textAlign='left';
  }
}

function drawGameOver() {
  ctx.fillStyle='rgba(0,0,0,0.78)';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.font='bold 58px monospace'; ctx.textAlign='center';
  ctx.fillStyle='#400000';
  ctx.fillText('THE DARK SIDE WINS', W/2+2, H/2-48+2);
  ctx.fillStyle='#e74c3c';
  ctx.fillText('THE DARK SIDE WINS', W/2, H/2-48);

  ctx.fillStyle='#fff'; ctx.font='22px monospace';
  ctx.fillText(`FINAL SCORE: ${gameState.score}`, W/2, H/2+10);

  if(gameState.score>0&&gameState.score>=gameState.highScore) {
    ctx.fillStyle='#f1c40f'; ctx.font='bold 16px monospace';
    ctx.fillText('★  NEW HIGH SCORE!  ★', W/2, H/2+42);
  } else if(gameState.highScore>0) {
    ctx.fillStyle='#888'; ctx.font='14px monospace';
    ctx.fillText(`HIGH SCORE: ${gameState.highScore}`, W/2, H/2+42);
  }

  ctx.fillStyle='#aaa'; ctx.font='15px monospace';
  const blink=Math.floor(gameState.titleTime*1.5)%2===0;
  if(blink) ctx.fillText('CLICK OR PRESS ANY KEY TO RESTART', W/2, H/2+82);
  ctx.restore();
  ctx.textAlign='left';
}

function drawWeaponSelect() {
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.font='bold 36px monospace'; ctx.textAlign='center';
  ctx.fillStyle='#ffdd00';
  ctx.fillText('CHOOSE YOUR WEAPON', W/2, H/2-150);
  ctx.font='16px monospace'; ctx.fillStyle='#aaa';
  ctx.fillText('Click a weapon to equip it for the next level', W/2, H/2-112);
  ctx.restore();

  const opts = gameState.weaponSelectOptions || [];
  const cardW=200, cardH=160, gap=30;
  const totalW = opts.length*(cardW+gap)-gap;
  const startX = W/2 - totalW/2;
  gameState._weaponCards = {};

  opts.forEach((key,i) => {
    const w = WEAPONS[key];
    const cx = startX + i*(cardW+gap);
    const cy = H/2 - cardH/2 + 10;
    const mx=input.mx, my=input.my;
    const hover = mx>=cx && mx<=cx+cardW && my>=cy && my<=cy+cardH;

    ctx.save();
    ctx.fillStyle = hover ? '#1a1a2e' : '#0d0d1a';
    ctx.strokeStyle = hover ? w.color : '#333';
    ctx.lineWidth = hover ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(cx,cy,cardW,cardH,10); ctx.fill(); ctx.stroke();

    // Weapon name
    ctx.fillStyle=w.color; ctx.font='bold 16px monospace'; ctx.textAlign='center';
    ctx.fillText(w.name, cx+cardW/2, cy+32);

    // Weapon icon (simple sketch)
    ctx.strokeStyle=w.color; ctx.lineWidth=2; ctx.save();
    ctx.translate(cx+cardW/2, cy+70);
    if (key==='lightsaber'){ ctx.strokeStyle='#00ff00'; ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(26,0);ctx.stroke(); ctx.fillStyle='#006600';ctx.fillRect(-4,-5,8,10); }
    else if (key==='shotgun'){ for(let s=-2;s<=2;s++){ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(26,s*8);ctx.stroke();} }
    else if (key==='dual'){ ctx.beginPath();ctx.moveTo(-14,-8);ctx.lineTo(22,-8);ctx.stroke(); ctx.beginPath();ctx.moveTo(-14,8);ctx.lineTo(22,8);ctx.stroke(); }
    else if (key==='ionCannon'){ ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-24,0);ctx.lineTo(24,0);ctx.stroke(); }
    else if (key==='rapidFire'){ for(let r=0;r<3;r++){ctx.save();ctx.globalAlpha=0.4+r*0.2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(22,0);ctx.stroke();ctx.restore();} }
    else { ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(22,0);ctx.stroke(); } // blaster
    ctx.restore();

    // Stats
    ctx.fillStyle='#888'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText(w.desc, cx+cardW/2, cy+102);
    const rateLabel = key==='lightsaber' ? 'MELEE' : `${Math.round(1/w.fireRate)} shots/s`;
    ctx.fillText(rateLabel, cx+cardW/2, cy+118);
    if (w.pierce) { ctx.fillStyle='#aa00ff'; ctx.fillText('PIERCING', cx+cardW/2, cy+134); }
    if (w.damage>1) { ctx.fillStyle='#ff6600'; ctx.fillText(`${w.damage}x DMG`, cx+cardW/2, cy+134); }

    // Hover glow
    if (hover) { ctx.fillStyle=w.color; ctx.font='bold 13px monospace'; ctx.fillText('▶ SELECT ◀', cx+cardW/2, cy+cardH-8); }
    ctx.restore();

    gameState._weaponCards[key] = {x:cx,y:cy,w:cardW,h:cardH};
  });

  ctx.textAlign='left';
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha=1;
  ctx.textAlign='left';

  drawBackground();

  if(gameState.current==='lobby') {
    particles.forEach(p=>p.draw(ctx));
    drawLobby();
    drawCrosshair();
    return;
  }

  // Pickups (drawn behind entities)
  for (const p of pickups) p.draw(ctx);

  // Back particles (blood, smoke behind entities)
  particles.filter(p=>p.type==='smoke'||p.type==='blood').forEach(p=>p.draw(ctx));

  // Bullets
  for(const b of bullets) b.draw(ctx);

  // Enemies (alive first, then dying)
  for(const e of enemies) if(e.alive) e.draw(ctx);
  for(const e of enemies) if(!e.alive) e.draw(ctx);

  // Player
  if(player) player.draw(ctx);

  // Front particles
  particles.filter(p=>p.type!=='smoke'&&p.type!=='blood').forEach(p=>p.draw(ctx));

  // Score popups
  scorePopups.forEach(s=>s.draw(ctx));

  ctx.globalAlpha=1;

  if(gameState.current==='playing') drawHUD();
  else if(gameState.current==='levelComplete') { drawHUD(); drawLevelComplete(); }
  else if(gameState.current==='gameOver') drawGameOver();
  else if(gameState.current==='weaponSelect') { drawHUD(); drawWeaponSelect(); }
  else if(gameState.current==='shop') drawShop();

  drawCrosshair();
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
const TICK = 1/60;
let acc=0, lastT=0;
function loop(ts) {
  const delta=Math.min((ts-lastT)/1000,0.1);
  lastT=ts;
  acc+=delta;
  while(acc>=TICK) { update(TICK); acc-=TICK; }
  draw();
  requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
particles=[]; scorePopups=[]; bullets=[]; enemies=[]; pickups=[];
player=null;
requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
</body>
